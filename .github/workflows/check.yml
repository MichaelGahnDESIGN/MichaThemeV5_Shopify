name: Prüfen
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
      # Struktur, JSON, Versionen, Secrets
      - run: node scripts/check-release.mjs
      # App-Tests
      - run: npm test
        working-directory: michatheme-v5-app
      - run: npm run check
        working-directory: michatheme-v5-app
      # ZIP muss sich bauen lassen
      - run: bash scripts/build-release.sh
